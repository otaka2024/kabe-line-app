<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="可部線">
<meta name="theme-color" content="#003f88">
<title>可部線 時刻</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #0d1b2e;
  --bg2: #162035;
  --bg3: #1e2d45;
  --blue: #1a6fc4;
  --blue2: #2480d4;
  --text: #e8f0fc;
  --text2: #9baec8;
  --green: #2ea84b;
  --orange: #e07000;
  --amber: #d4980a;
  --red: #d04040;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  height: 100%; height: 100dvh;
  font-family: 'Noto Sans JP', 'Hiragino Sans', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
button, .tab, .board-btn { touch-action: manipulation; }

/* ── Header ── */
#header {
  background: var(--bg2);
  border-bottom: 1px solid #1e3050;
  padding: 10px 16px 8px;
  position: sticky; top: 0; z-index: 100;
}
#clock {
  font-size: 2.6rem; font-weight: 700; letter-spacing: 0.04em;
  line-height: 1; color: #fff;
}
#date-line { font-size: 0.85rem; color: var(--text2); margin-top: 2px; }
#ver-badge {
  font-size: 0.62rem; color: #4a6a8a;
  margin-left: 8px; vertical-align: middle;
  font-family: monospace;
}
#offline-msg { display: none; font-size: 0.75rem; color: var(--amber); margin-top: 2px; }
#offline-msg.show { display: block; }
#install-btn {
  display: none;
  position: absolute; top: 10px; right: 16px;
  background: var(--blue); color: #fff;
  border: none; border-radius: 6px;
  padding: 5px 12px; font-size: 0.75rem; font-weight: 700;
  cursor: pointer;
}
#install-btn.show { display: block; }

/* ── Debug panel ── */
#debug-bar {
  display: none;
  align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 16px;
  background: #1a0a00;
  border-bottom: 1px solid #a04000;
  font-size: 0.78rem;
}
#debug-bar.show { display: flex; }
#debug-bar label { color: #f08040; font-weight: 600; }
#debug-bar input[type="time"], #debug-bar select {
  background: #2a1000; color: #ffcc88; border: 1px solid #804020;
  border-radius: 5px; padding: 3px 7px; font-size: 0.78rem;
}
#debug-bar button {
  background: #803010; color: #ffcc88; border: none;
  border-radius: 5px; padding: 3px 10px; font-size: 0.78rem; cursor: pointer;
}
#debug-bar button:hover { background: #a04010; }
#debug-badge {
  position: absolute; top: 8px; right: 16px;
  font-size: 0.65rem; color: #f08040; font-weight: 700; letter-spacing: 0.05em;
  cursor: pointer; padding: 2px 6px; border: 1px solid #804020; border-radius: 4px;
  background: #1a0800;
}

/* ── Tabs ── */
#tabs { display: flex; background: var(--bg2); border-bottom: 1px solid #1e3050; }
.tab {
  flex: 1; padding: 14px 0; text-align: center;
  font-size: 1.1rem; font-weight: 600; cursor: pointer;
  color: var(--text2); border-bottom: 3px solid transparent;
  transition: color .2s, border-color .2s;
}
.tab.active { color: #fff; border-bottom-color: var(--blue2); }

/* ── Board selector ── */
#board-selector {
  display: flex; gap: 10px; padding: 12px 16px;
  background: var(--bg);
}
.board-btn {
  flex: 1; padding: 12px 8px; text-align: center;
  border-radius: var(--radius); border: 2px solid #2a3f5f;
  font-size: 1.05rem; font-weight: 600; cursor: pointer;
  color: var(--text2); background: var(--bg2);
  transition: all .2s;
}
.board-btn.active {
  border-color: var(--blue2); color: #fff; background: #143060;
}

/* ── Train list ── */
#content {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.train-list {
  padding: 12px 14px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 10px;
}

.train-card {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #1e3050;
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  position: relative; overflow: hidden;
}
.train-card.nearest {
  border-color: var(--orange);
  background: #1e1600;
}
.train-card.past { opacity: 0.35; }
.train-card.imminent { border-color: var(--red); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{border-color:var(--red)} 50%{border-color:#a03030} }

/* 左ライン */
.train-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--blue2); border-radius: var(--radius) 0 0 var(--radius);
}
.train-card.nearest::before { background: var(--orange); }
.train-card.past::before { background: #2a3f5f; }

/* 時刻 */
.dep-time {
  font-size: 2.5rem; font-weight: 800; line-height: 1;
  color: #fff; min-width: 70px; text-align: center;
}
.train-card.past .dep-time { color: var(--text2); }

/* 真ん中エリア */
.train-mid { flex: 1; min-width: 0; }
.countdown {
  font-size: 1.85rem; font-weight: 700; color: var(--blue2);
  line-height: 1; margin-bottom: 4px;
}
.train-card.imminent .countdown { color: var(--red); }
.train-card.past .countdown { color: var(--text2); }
.arr-line { font-size: 0.9rem; color: var(--text2); }
.arr-time { font-size: 1.6rem; font-weight: 700; color: var(--text); }

/* 右バッジ */
.badges { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.badge {
  font-size: 0.85rem; font-weight: 800; padding: 4px 12px;
  border-radius: 20px; white-space: nowrap; letter-spacing: 0.03em;
}
.badge.akikame { background: #1e7a30; color: #fff; }
.badge.bairin  { background: #c05800; color: #fff; }
.badge.ryokui  { background: #2255c0; color: #fff; }
.badge.nearest { background: #3a1a00; color: #e07000; }
.badge.origin  { background: #0e5a6e; color: #fff; }

/* no-trains */
.no-trains {
  text-align: center; color: var(--text2);
  font-size: 1rem; padding: 40px 20px;
}
.end-msg {
  text-align: center; color: var(--text2);
  font-size: 0.8rem; padding: 16px; margin-top: 4px;
}

/* タブコンテンツ */
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Pixel 6a / スマホ最適化 */
@media (max-width: 480px) {
  #clock { font-size: 2.2rem; }
  .dep-time { font-size: 2.1rem; min-width: 62px; }
  .countdown { font-size: 1.5rem; }
  .arr-time { font-size: 1.3rem; }
  .train-card { padding: 12px 12px; gap: 10px; }
  .badge { font-size: 0.78rem; padding: 4px 9px; }
  .tab { padding: 13px 0; font-size: 1rem; }
}
</style>
</head>
<body>

<div id="header" style="position:relative">
  <div id="clock" onclick="onClockClick()" style="cursor:pointer">--:--:--</div>
  <div style="display:flex;align-items:baseline;gap:8px">
    <div id="date-line">読み込み中…</div>
    <span id="ver-badge"></span>
  </div>
  <div id="offline-msg">⚠ オフライン</div>
  <button id="install-btn" onclick="installPWA()">📲 インストール</button>
  <div id="debug-badge" onclick="toggleDebug()" title="デバッグモード切替" style="display:none">🛠 DEBUG</div>
</div>

<div id="debug-bar">
  <label>🛠 DEBUG</label>
  <select id="dbg-day">
    <option value="1">月（平日）</option>
    <option value="2">火（平日）</option>
    <option value="3">水（平日）</option>
    <option value="4">木（平日）</option>
    <option value="5">金（平日）</option>
    <option value="6">土（休日）</option>
    <option value="0">日（休日）</option>
  </select>
  <input type="time" id="dbg-time" value="07:30">
  <button onclick="applyDebugTime()">適用</button>
  <button onclick="resetDebugTime()">リセット</button>
</div>

<div id="tabs">
  <div class="tab active" onclick="switchTab('iki')" id="tab-iki">行き</div>
  <div class="tab"        onclick="switchTab('kaeri')" id="tab-kaeri">帰り</div>
</div>

<div id="content">
  <!-- 行きタブ -->
  <div class="tab-pane active" id="pane-iki">
    <div id="board-selector">
      <div class="board-btn active" onclick="setBoard('shichiken')" id="btn-shichiken">七軒茶屋</div>
      <div class="board-btn"       onclick="setBoard('ryokui')"    id="btn-ryokui">緑井</div>
    </div>
    <div class="train-list" id="list-iki"></div>
  </div>

  <!-- 帰りタブ -->
  <div class="tab-pane" id="pane-kaeri">
    <div class="train-list" id="list-kaeri"></div>
  </div>
</div>

<script>
// ───────────────────────────────────
// State
// ───────────────────────────────────
const APP_VER = '1.0.0';

// PWA インストール
let _deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredPrompt = e;
  document.getElementById('install-btn').classList.add('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn').classList.remove('show');
  _deferredPrompt = null;
});
function installPWA() {
  if (!_deferredPrompt) return;
  _deferredPrompt.prompt();
  _deferredPrompt.userChoice.then(() => { _deferredPrompt = null; });
}
let TT   = null;       // timetable.json
let board = 'shichiken'; // 七軒茶屋 or 緑井
let activeTab = 'iki';

// ───────────────────────────────────
// Debug time override
// ───────────────────────────────────
let debugMinutes = null;  // null = 実時刻, 数値 = 上書き分
let debugDay = null;      // null = 実曜日, 0-6 = 上書き曜日

let _clockClicks = 0, _clockTimer = null;
function onClockClick() {
  _clockClicks++;
  clearTimeout(_clockTimer);
  _clockTimer = setTimeout(() => { _clockClicks = 0; }, 600);
  if (_clockClicks >= 3) { _clockClicks = 0; toggleDebug(); }
}

function toggleDebug() {
  const bar = document.getElementById('debug-bar');
  bar.classList.toggle('show');
}

function applyDebugTime() {
  const timeVal = document.getElementById('dbg-time').value; // "HH:MM"
  const dayVal  = parseInt(document.getElementById('dbg-day').value, 10);
  if (!timeVal) return;
  const [h, m] = timeVal.split(':').map(Number);
  debugMinutes = h * 60 + m;
  debugDay = dayVal;
  document.getElementById('debug-badge').style.display = 'block';
  render();
  updateClock();
}

function resetDebugTime() {
  debugMinutes = null;
  debugDay = null;
  document.getElementById('debug-badge').style.display = 'none';
  render();
  updateClock();
}

// ───────────────────────────────────
// Time helpers
// ───────────────────────────────────
function nowMinutes() {
  if (debugMinutes !== null) return debugMinutes;
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}
function hhmm2min(s) {
  if (!s) return null;
  const [h, m] = s.split(':').map(Number);
  return h * 60 + m;
}
function minToHHMM(min) {
  const h = Math.floor(min / 60) % 24;
  const m = min % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function countdown(depMin, nowMin) {
  const diff = depMin - nowMin;
  if (diff < 0) return null;   // 出発済み
  if (diff === 0) return '今すぐ';
  return `あと${diff}分`;
}
function isWeekday() {
  const d = debugDay !== null ? debugDay : new Date().getDay();
  return d >= 1 && d <= 5;
}

// ───────────────────────────────────
// Rendering
// ───────────────────────────────────
function renderIki() {
  if (!TT) return;
  const el = document.getElementById('list-iki');
  const now = nowMinutes();
  const isWd = isWeekday();
  const SHOW = 7;

  // 上り列車（boarding stationに停車するもの）
  const upTrains = TT.up
    .filter(t => {
      const depTime = t[board]; // ryokui or shichiken
      if (!depTime) return false;
      if (!isWd && t.weekday_only) return false;
      return true;
    })
    .map(t => ({
      type: 'normal',
      depKey: board,
      dep: t[board],
      depMin: hhmm2min(t[board]),
      arr: t.hiroshima,
      arrLabel: '広島着',
      origin: t.origin,
      no: t.no,
    }));

  // 梅林以降停車の上り列車リスト（乗り換え用）
  const upFromBairin = TT.up.filter(u => u.bairin && u.hiroshima && (!u.weekday_only || isWd));

  // 下り 梅林行き（最寄りパターン）boarding stationから梅林→乗換→広島
  const nearTrains = TT.down
    .filter(t => {
      if (t.terminal !== '梅林') return false;
      const depTime = t[board];
      if (!depTime) return false;
      if (!isWd && t.weekday_only) return false;
      return true;
    })
    .map(t => {
      const bairinArrMin = hhmm2min(t.bairin);
      // 梅林着後に乗れる最初の上り電車を探す
      const connecting = upFromBairin
        .filter(u => hhmm2min(u.bairin) >= bairinArrMin)
        .sort((a, b) => hhmm2min(a.bairin) - hhmm2min(b.bairin))[0];
      return {
        type: 'nearest',
        dep: t[board],
        depMin: hhmm2min(t[board]),
        arr: connecting ? connecting.hiroshima : null,
        arrLabel: '広島着',
        origin: null,
        no: t.no,
      };
    });

  // 合体してdep昇順
  const all = [...upTrains, ...nearTrains].sort((a,b) => a.depMin - b.depMin);

  // 過去を除外（少し前のは残す: -3分まで）
  const shown = all.filter(t => t.depMin >= now - 3).slice(0, SHOW);

  if (shown.length === 0) {
    el.innerHTML = '<div class="no-trains">本日の上り列車は終了しました</div>';
    return;
  }

  el.innerHTML = shown.map(t => trainCard(t, now)).join('');
}

function renderKaeri() {
  if (!TT) return;
  const el = document.getElementById('list-kaeri');
  const now = nowMinutes();
  const isWd = isWeekday();
  const SHOW = 8;

  const trains = TT.down
    .filter(t => {
      if (!t.hiroshima) return false;
      if (!isWd && t.weekday_only) return false;
      return true;
    })
    .map(t => ({
      type: 'kaeri',
      dep: t.hiroshima,
      depMin: hhmm2min(t.hiroshima),
      terminal: t.terminal,
      shichiken: t.shichiken,
      ryokui: t.ryokui,
      bairin: t.bairin,
      no: t.no,
    }))
    .sort((a,b) => a.depMin - b.depMin);

  const shown = trains.filter(t => t.depMin >= now - 3).slice(0, SHOW);

  if (shown.length === 0) {
    el.innerHTML = '<div class="no-trains">本日の下り列車は終了しました</div>';
    return;
  }

  el.innerHTML = shown.map(t => kaeriCard(t, now)).join('');
}

function trainCard(t, now) {
  const diff = t.depMin - now;
  const isPast = diff < -3;
  const isImminent = diff >= 0 && diff <= 2;
  const cls = [
    'train-card',
    t.type === 'nearest' ? 'nearest' : '',
    isPast ? 'past' : '',
    isImminent ? 'imminent' : '',
  ].filter(Boolean).join(' ');

  const cdText = isPast ? '出発済' : (countdown(t.depMin, now) ?? '出発済');
  const cdClass = isPast ? '' : 'countdown';

  // バッジ
  const badges = [];
  if (t.type === 'nearest') {
    badges.push('<span class="badge nearest">🟠 梅林行き 最寄り</span>');
  }
  if (t.origin && t.origin !== 'あき亀山') {
    badges.push(`<span class="badge origin">${t.origin}始発</span>`);
  }

  return `
<div class="${cls}">
  <div class="dep-time">${t.dep}</div>
  <div class="train-mid">
    <div class="${cdClass}">${cdText}</div>
    <div class="arr-line">${t.arrLabel} <span class="arr-time">${t.arr || '—'}</span></div>
  </div>
  <div class="badges">${badges.join('')}</div>
</div>`;
}

function kaeriCard(t, now) {
  const diff = t.depMin - now;
  const isPast = diff < -3;
  const isImminent = diff >= 0 && diff <= 2;
  const cls = [
    'train-card',
    isPast ? 'past' : '',
    isImminent ? 'imminent' : '',
  ].filter(Boolean).join(' ');

  const cdText = isPast ? '出発済' : (countdown(t.depMin, now) ?? '出発済');
  const cdClass = isPast ? '' : 'countdown';

  // 到着時刻と行き先バッジ
  let arrLabel, arrTime, badge;
  if (t.terminal === 'あき亀山') {
    arrLabel = '七軒茶屋着'; arrTime = t.shichiken;
    badge = '<span class="badge akikame">あき亀山行</span>';
  } else if (t.terminal === '梅林') {
    arrLabel = '七軒茶屋着'; arrTime = t.shichiken;
    badge = '<span class="badge bairin">梅林行き</span>';
  } else {
    // 緑井行き
    arrLabel = '緑井着'; arrTime = t.ryokui;
    badge = '<span class="badge ryokui">緑井行き</span>';
  }

  return `
<div class="${cls}">
  <div class="dep-time">${t.dep}</div>
  <div class="train-mid">
    <div class="${cdClass}">${cdText}</div>
    <div class="arr-line">${arrLabel} <span class="arr-time">${arrTime || '—'}</span></div>
  </div>
  <div class="badges">${badge}</div>
</div>`;
}

// ───────────────────────────────────
// Clock
// ───────────────────────────────────
const DAYS = ['日','月','火','水','木','金','土'];
function updateClock() {
  const n = new Date();
  let hms;
  if (debugMinutes !== null) {
    const dh = Math.floor(debugMinutes / 60) % 24;
    const dm = debugMinutes % 60;
    hms = `${String(dh).padStart(2,'0')}:${String(dm).padStart(2,'0')}:--`;
  } else {
    hms = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  }
  document.getElementById('clock').textContent = hms;
  const day = debugDay !== null ? debugDay : n.getDay();
  document.getElementById('date-line').textContent =
    `${n.getMonth()+1}月${n.getDate()}日（${DAYS[day]}）${isWeekday()?'平日ダイヤ':'土休日ダイヤ（参考）'}`;
  // 毎分0秒でリスト更新（デバッグ中は自動更新しない）
  if (debugMinutes === null && n.getSeconds() === 0) render();
}

// ───────────────────────────────────
// UI
// ───────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`pane-${tab}`).classList.add('active');
  render();
}

function setBoard(b) {
  board = b;
  document.querySelectorAll('.board-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`btn-${b}`).classList.add('active');
  renderIki();
}

function render() {
  if (activeTab === 'iki') renderIki();
  else renderKaeri();
}

// ───────────────────────────────────
// Boot
// ───────────────────────────────────
async function boot() {
  document.getElementById('ver-badge').textContent = 'v' + APP_VER;
  updateClock();
  setInterval(updateClock, 1000);

  // 15秒ごとにリスト更新
  setInterval(render, 15000);

  // オフライン検知
  window.addEventListener('offline', () => document.getElementById('offline-msg').classList.add('show'));
