<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="可部線">
<meta name="theme-color" content="#0a3d7a">
<title>可部線 時刻</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #0d1b2e;
  --bg2: #162035;
  --bg3: #1e2d45;
  --text: #e8f0fc;
  --text2: #9baec8;
  --red: #c0392b;
  --radius: 12px;
  --theme: #0a3d7a;
  --theme-line: #4da6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  height: 100dvh;
  display: flex; flex-direction: column;
  font-family: 'Noto Sans JP', 'Hiragino Sans', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
button, .tab, .board-btn { touch-action: manipulation; }

/* ── Header ── */
#header {
  background: var(--theme);
  padding: 10px 16px 8px;
  position: relative;
  flex-shrink: 0;
  transition: background 0.25s;
}
#clock {
  font-size: 2.6rem; font-weight: 700; letter-spacing: 0.04em;
  line-height: 1; color: #fff;
}
#date-line { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-top: 2px; }
#ver-badge { font-size: 0.62rem; color: rgba(255,255,255,0.4); margin-left: 8px; font-family: monospace; vertical-align: middle; }
#offline-msg { display: none; font-size: 0.75rem; color: #ffdd99; margin-top: 2px; }
#offline-msg.show { display: block; }
#install-btn {
  display: none;
  position: absolute; top: 10px; right: 48px;
  background: rgba(255,255,255,0.18); color: #fff;
  border: 1px solid rgba(255,255,255,0.35); border-radius: 6px;
  padding: 5px 12px; font-size: 0.75rem; font-weight: 700;
  cursor: pointer;
}
#install-btn.show { display: block; }
#gear-btn {
  position: absolute; top: 10px; right: 14px;
  background: none; border: none;
  font-size: 1.35rem; color: rgba(255,255,255,0.55);
  cursor: pointer; padding: 2px; line-height: 1;
}
#gear-btn:hover { color: #fff; }
#refresh-btn {
  position: absolute; top: 10px; right: 50px;
  background: none; border: none;
  font-size: 1.2rem; color: rgba(255,255,255,0.55);
  cursor: pointer; padding: 2px; line-height: 1;
  transition: transform 0.4s ease, color 0.2s;
}
#refresh-btn:hover { color: #fff; }
#refresh-btn.spinning { animation: spin 0.5s linear; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
#debug-badge {
  position: absolute; top: 8px; right: 56px;
  font-size: 0.62rem; color: #f08040; font-weight: 700;
  cursor: pointer; padding: 2px 6px; border: 1px solid #804020; border-radius: 4px;
  background: #1a0800;
}

/* ── Debug panel ── */
#debug-bar {
  display: none;
  align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 16px;
  background: #1a0a00;
  border-bottom: 1px solid #a04000;
  font-size: 0.78rem;
  flex-shrink: 0;
}
#debug-bar.show { display: flex; }
#debug-bar label { color: #f08040; font-weight: 600; }
#debug-bar input[type="time"], #debug-bar select {
  background: #2a1000; color: #ffcc88; border: 1px solid #804020;
  border-radius: 5px; padding: 3px 7px; font-size: 0.78rem;
}
#debug-bar button {
  background: #803010; color: #ffcc88; border: none;
  border-radius: 5px; padding: 3px 10px; font-size: 0.78rem; cursor: pointer;
}

/* ── Delay banner ── */
#delay-banner {
  display: none;
  background: #c0392b; color: #fff;
  font-size: 0.85rem; font-weight: 700;
  padding: 8px 16px;
  cursor: pointer;
  flex-shrink: 0;
  text-align: center;
  letter-spacing: 0.03em;
}
#delay-banner.show { display: block; }

/* ── Tabs ── */
#tabs {
  display: flex;
  background: var(--theme);
  border-bottom: 1px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
  transition: background 0.25s;
}
.tab {
  flex: 1; padding: 13px 0; text-align: center;
  font-size: 1.05rem; font-weight: 600; cursor: pointer;
  color: rgba(255,255,255,0.55); border-bottom: 3px solid transparent;
  transition: color .2s, border-color .3s;
}
.tab.active { color: #fff; border-bottom-color: var(--theme-line); }

/* ── Board selector ── */
#board-selector {
  display: flex; gap: 10px; padding: 10px 12px;
  background: var(--bg);
  flex-shrink: 0;
}
.board-btn {
  flex: 1; padding: 10px 8px; text-align: center;
  border-radius: var(--radius); border: 2px solid #2a3f5f;
  font-size: 1rem; font-weight: 600; cursor: pointer;
  color: var(--text2); background: var(--bg2);
  transition: all .2s;
}
.board-btn.active { border-color: var(--theme); color: #fff; background: var(--theme); }

/* ── Content / scroll structure ── */
#content {
  flex: 1; min-height: 0;
  overflow: hidden;
}
.tab-pane {
  display: none;
  flex-direction: column;
  height: 100%;
}
.tab-pane.active { display: flex; }

.list-scroll {
  flex: 1; min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.train-list {
  padding: 10px 12px;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 10px;
}

/* ── Train card ── */
.train-card {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid #1e3050;
  padding: 0 14px 0 18px;
  height: 90px;
  display: flex; align-items: center; gap: 8px;
  position: relative; overflow: hidden;
  flex-shrink: 0;
}
/* left line */
.train-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: transparent;
  border-radius: var(--radius) 0 0 var(--radius);
}
/* past */
.train-card.past { opacity: 0.3; }
/* imminent */
.train-card.imminent { animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{border-color:#c0392b} 50%{border-color:#882020} }

/* ── Card type variants ── */
/* 行き: 梅林折り返し */
.train-card.c-nearest { background: #edf4ff; border-color: #90bef5; }
.train-card.c-nearest::before { background: #0a3d7a; }
.train-card.c-nearest .t-dep,
.train-card.c-nearest .t-arr { color: #0d2244; }
.train-card.c-nearest .t-arrow { color: #4a7ab0; }

/* 行き: 梅林始発 */
.train-card.c-bairin { background: #fff8f0; border-color: #ffcc80; }
.train-card.c-bairin::before { background: #e67e22; }
.train-card.c-bairin .t-dep,
.train-card.c-bairin .t-arr { color: #3a200a; }
.train-card.c-bairin .t-arrow { color: #a05820; }

/* 行き: 緑井始発 */
.train-card.c-ryokui { background: #f0faf0; border-color: #a5d6a7; }
.train-card.c-ryokui::before { background: #2e7d32; }
.train-card.c-ryokui .t-dep,
.train-card.c-ryokui .t-arr { color: #1a2e1a; }
.train-card.c-ryokui .t-arrow { color: #4a8a4a; }

/* 帰り: 緑井行き */
.train-card.c-kaeri-ryokui { background: #e8f5e9; border-color: #a5d6a7; }
.train-card.c-kaeri-ryokui::before { background: #2e7d32; }
.train-card.c-kaeri-ryokui .t-dep,
.train-card.c-kaeri-ryokui .t-arr { color: #1a2e1a; }
.train-card.c-kaeri-ryokui .t-arrow { color: #4a8a4a; }

/* ── Time layout ── */
.t-times {
  display: flex; align-items: baseline; gap: 5px;
  flex-shrink: 0;
}
.t-dep, .t-arr {
  font-size: 30px; font-weight: 800; line-height: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.t-arrow { font-size: 18px; color: var(--text2); }
.t-cd {
  font-size: 26px; font-weight: 700; line-height: 1;
  flex: 1; text-align: center;
  white-space: nowrap;
}
.t-cd.cd-past { font-size: 13px; color: var(--text2) !important; font-weight: 400; }
.t-cd.cd-red  { color: #c0392b !important; }
.t-badge { min-width: 74px; text-align: right; flex-shrink: 0; }

/* ── Badges ── */
.badge {
  display: inline-block;
  font-size: 0.7rem; font-weight: 800; padding: 3px 8px;
  border-radius: 20px; white-space: nowrap;
}
.bg-nearest  { background: #cfe2ff; color: #0c447c; }
.bg-bairin   { background: #faeeda; color: #854f0b; }
.bg-ryokui   { background: #2e7d32; color: #fff; }
.bg-k-ryokui { background: #2e7d32; color: #fff; }

/* ── Current anchor ── */
#iki-anchor, #kaeri-anchor { height: 0; flex-shrink: 0; }

/* ── No-trains msg ── */
.no-trains {
  text-align: center; color: var(--text2);
  font-size: 0.95rem; padding: 40px 16px;
}

/* ── Floating "現在に戻る" ── */
#back-to-now {
  display: none;
  position: fixed;
  bottom: calc(22px + env(safe-area-inset-bottom));
  right: 16px;
  background: var(--theme); color: #fff;
  border: none; border-radius: 24px;
  padding: 10px 18px; font-size: 0.88rem; font-weight: 700;
  box-shadow: 0 4px 18px rgba(0,0,0,0.45);
  cursor: pointer;
  z-index: 200;
  transition: background 0.25s;
}
#back-to-now.show { display: block; }

/* ── Mobile ── */
@media (max-width: 400px) {
  #clock { font-size: 2.2rem; }
  .t-dep, .t-arr { font-size: 26px; }
  .t-cd { font-size: 22px; }
  .train-card { height: 82px; padding: 0 10px 0 16px; }
  .tab { padding: 11px 0; font-size: 0.95rem; }
  .badge { font-size: 0.63rem; padding: 2px 6px; }
  .t-badge { min-width: 64px; }
}
</style>
</head>
<body>

<div id="header" style="position:relative">
  <div id="clock" onclick="onClockClick()" style="cursor:pointer">--:--:--</div>
  <div style="display:flex;align-items:baseline;gap:6px">
    <div id="date-line">読み込み中…</div>
    <span id="ver-badge"></span>
  </div>
  <div id="offline-msg">⚠ オフライン</div>
  <button id="install-btn" onclick="installPWA()">📲 インストール</button>
  <div id="debug-badge" onclick="toggleDebug()" style="display:none">🛠</div>
  <button id="refresh-btn" title="更新" onclick="manualRefresh()">↻</button>
  <button id="gear-btn" title="設定">⚙</button>
</div>

<div id="debug-bar">
  <label>🛠 DEBUG</label>
  <select id="dbg-day">
    <option value="1">月（平日）</option>
    <option value="2">火（平日）</option>
    <option value="3">水（平日）</option>
    <option value="4">木（平日）</option>
    <option value="5">金（平日）</option>
    <option value="6">土（休日）</option>
    <option value="0">日（休日）</option>
  </select>
  <input type="time" id="dbg-time" value="07:30">
  <button onclick="applyDebugTime()">適用</button>
  <button onclick="resetDebugTime()">リセット</button>
</div>

<div id="delay-banner" onclick="openTrafficInfo()">⚠️ 可部線 運行情報あり</div>

<div id="tabs">
  <div class="tab active" onclick="switchTab('iki')" id="tab-iki">行き</div>
  <div class="tab"        onclick="switchTab('kaeri')" id="tab-kaeri">帰り</div>
</div>

<div id="content">
  <div class="tab-pane active" id="pane-iki">
    <div id="board-selector">
      <div class="board-btn active" onclick="setBoard('shichiken')" id="btn-shichiken">七軒茶屋</div>
      <div class="board-btn"        onclick="setBoard('ryokui')"    id="btn-ryokui">緑井</div>
    </div>
    <div class="list-scroll" id="scroll-iki">
      <div class="train-list" id="list-iki"></div>
    </div>
  </div>
  <div class="tab-pane" id="pane-kaeri">
    <div class="list-scroll" id="scroll-kaeri">
      <div class="train-list" id="list-kaeri"></div>
    </div>
  </div>
</div>

<button id="back-to-now" onclick="backToNow()">現在に戻る</button>

<script>
const APP_VER = '2.0.3';

// ── PWA ──
let _deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); _deferredPrompt = e;
  document.getElementById('install-btn').classList.add('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn').classList.remove('show');
  _deferredPrompt = null;
});
function installPWA() {
  if (!_deferredPrompt) return;
  _deferredPrompt.prompt();
  _deferredPrompt.userChoice.then(() => { _deferredPrompt = null; });
}

let TT = null;
let board = 'shichiken';
let activeTab = 'iki';

// ── Debug ──
let debugMinutes = null, debugDay = null;
let _clockClicks = 0, _clockTimer = null;

function onClockClick() {
  _clockClicks++;
  clearTimeout(_clockTimer);
  _clockTimer = setTimeout(() => { _clockClicks = 0; }, 600);
  if (_clockClicks >= 3) { _clockClicks = 0; toggleDebug(); }
}
function toggleDebug() {
  document.getElementById('debug-bar').classList.toggle('show');
}
function applyDebugTime() {
  const t = document.getElementById('dbg-time').value;
  const d = parseInt(document.getElementById('dbg-day').value, 10);
  if (!t) return;
  const [h, m] = t.split(':').map(Number);
  debugMinutes = h * 60 + m; debugDay = d;
  document.getElementById('debug-badge').style.display = 'block';
  render(); updateClock();
}
function resetDebugTime() {
  debugMinutes = null; debugDay = null;
  document.getElementById('debug-badge').style.display = 'none';
  render(); updateClock();
}

// ── Time helpers ──
function nowMinutes() {
  if (debugMinutes !== null) return debugMinutes;
  const n = new Date(); return n.getHours() * 60 + n.getMinutes();
}
function hhmm2min(s) {
  if (!s) return null;
  const [h, m] = s.split(':').map(Number); return h * 60 + m;
}
function isWeekday() {
  const d = debugDay !== null ? debugDay : new Date().getDay();
  return d >= 1 && d <= 5;
}

// ── Countdown HTML ──
function cdHtml(diff, normalColor) {
  if (diff < -3) return `<span class="t-cd cd-past">出発済</span>`;
  if (diff <= 0)  return `<span class="t-cd cd-red">まもなく発車</span>`;
  if (diff <= 10) return `<span class="t-cd cd-red">あと${diff}分</span>`;
  return `<span class="t-cd" style="color:${normalColor}">あと${diff}分</span>`;
}

// ── 行き card ──
function trainCard(t, now) {
  const diff = t.depMin - now;
  const isPast = diff < -3;
  const isImminent = !isPast && diff <= 0;

  let cardCls = '', badge = '', normalColor = '#4da6ff';
  if (t.type === 'nearest') {
    cardCls = 'c-nearest'; normalColor = '#2a5faa';
    badge = '<span class="badge bg-nearest">梅林折り返し</span>';
  } else if (t.origin === '梅林') {
    cardCls = 'c-bairin'; normalColor = '#a05010';
    badge = '<span class="badge bg-bairin">梅林始発</span>';
  } else if (t.origin === '緑井' && board === 'ryokui') {
    cardCls = 'c-ryokui'; normalColor = '#2e7d32';
    badge = '<span class="badge bg-ryokui">緑井始発</span>';
  }

  const cls = ['train-card', cardCls, isPast ? 'past' : '', isImminent ? 'imminent' : '']
    .filter(Boolean).join(' ');

  return `<div class="${cls}">
  <div class="t-times"><span class="t-dep">${t.dep}</span><span class="t-arrow">→</span><span class="t-arr">${t.arr || '—'}</span></div>
  ${cdHtml(diff, normalColor)}
  <div class="t-badge">${badge}</div>
</div>`;
}

// ── 帰り card ──
function kaeriCard(t, now) {
  const diff = t.depMin - now;
  const isPast = diff < -3;
  const isImminent = !isPast && diff <= 0;

  let cardCls = '', badge = '', arrTime = '', normalColor = '#1b5e20';
  if (t.terminal === '緑井') {
    cardCls = 'c-kaeri-ryokui';
    badge = '<span class="badge bg-k-ryokui">緑井行き</span>';
    arrTime = t.ryokui;
  } else {
    arrTime = t.shichiken;
  }

  const cls = ['train-card', cardCls, isPast ? 'past' : '', isImminent ? 'imminent' : '']
    .filter(Boolean).join(' ');

  return `<div class="${cls}">
  <div class="t-times"><span class="t-dep">${t.dep}</span><span class="t-arrow">→</span><span class="t-arr">${arrTime || '—'}</span></div>
  ${cdHtml(diff, normalColor)}
  <div class="t-badge">${badge}</div>
</div>`;
}

// ── Render 行き ──
function renderIki() {
  if (!TT) return;
  const el = document.getElementById('list-iki');
  const now = nowMinutes();
  const isWd = isWeekday();

  const upTrains = TT.up
    .filter(t => t[board] && (isWd || !t.weekday_only))
    .map(t => ({
      type: 'normal', dep: t[board], depMin: hhmm2min(t[board]),
      arr: t.hiroshima, origin: t.origin, no: t.no,
    }));

  const upFromBairin = TT.up.filter(u => u.bairin && u.hiroshima && (!u.weekday_only || isWd));

  const nearTrains = TT.down
    .filter(t => t.terminal === '梅林' && t[board] && (isWd || !t.weekday_only))
    .map(t => {
      const bMin = hhmm2min(t.bairin);
      const con = upFromBairin.filter(u => hhmm2min(u.bairin) >= bMin)
        .sort((a, b) => hhmm2min(a.bairin) - hhmm2min(b.bairin))[0];
      return { type: 'nearest', dep: t[board], depMin: hhmm2min(t[board]),
               arr: con ? con.hiroshima : null, origin: null, no: t.no };
    });

  const all = [...upTrains, ...nearTrains].sort((a, b) => a.depMin - b.depMin);
  if (all.length === 0) {
    el.innerHTML = '<div class="no-trains">本日の上り列車は終了しました</div>'; return;
  }

  const anchorIdx = Math.max(0, all.findIndex(t => t.depMin >= now - 3));
  let html = '';
  all.forEach((t, i) => {
    if (i === anchorIdx) html += '<div id="iki-anchor"></div>';
    html += trainCard(t, now);
  });
  if (anchorIdx >= all.length) html += '<div id="iki-anchor"></div>';
  el.innerHTML = html;
  scrollToAnchor('iki');
}

// ── Render 帰り ──
function renderKaeri() {
  if (!TT) return;
  const el = document.getElementById('list-kaeri');
  const now = nowMinutes();
  const isWd = isWeekday();

  const trains = TT.down
    .filter(t => t.hiroshima && (isWd || !t.weekday_only))
    .map(t => ({ dep: t.hiroshima, depMin: hhmm2min(t.hiroshima),
                 terminal: t.terminal, shichiken: t.shichiken, ryokui: t.ryokui, no: t.no }))
    .sort((a, b) => a.depMin - b.depMin);

  if (trains.length === 0) {
    el.innerHTML = '<div class="no-trains">本日の下り列車は終了しました</div>'; return;
  }

  const anchorIdx = Math.max(0, trains.findIndex(t => t.depMin >= now - 3));
  let html = '';
  trains.forEach((t, i) => {
    if (i === anchorIdx) html += '<div id="kaeri-anchor"></div>';
    html += kaeriCard(t, now);
  });
  if (anchorIdx >= trains.length) html += '<div id="kaeri-anchor"></div>';
  el.innerHTML = html;
  scrollToAnchor('kaeri');
}

// ── Scroll helpers ──
function scrollToAnchor(which) {
  const anchorId = (which || activeTab) === 'iki' ? 'iki-anchor' : 'kaeri-anchor';
  const scrollId = (which || activeTab) === 'iki' ? 'scroll-iki' : 'scroll-kaeri';
  requestAnimationFrame(() => {
    const anchor = document.getElementById(anchorId);
    const scroller = document.getElementById(scrollId);
    if (!anchor || !scroller) return;
    const anchorRect = anchor.getBoundingClientRect();
    const scrollerRect = scroller.getBoundingClientRect();
    scroller.scrollTop += anchorRect.top - scrollerRect.top;
    observeAnchor();
  });
}
function backToNow() { scrollToAnchor(); }

let _anchorObserver = null;
function observeAnchor() {
  if (_anchorObserver) _anchorObserver.disconnect();
  const anchorId = activeTab === 'iki' ? 'iki-anchor' : 'kaeri-anchor';
  const scrollId = activeTab === 'iki' ? 'scroll-iki' : 'scroll-kaeri';
  const anchor = document.getElementById(anchorId);
  const scroller = document.getElementById(scrollId);
  if (!anchor || !scroller) return;
  _anchorObserver = new IntersectionObserver(
    entries => {
      document.getElementById('back-to-now').classList.toggle('show', !entries[0].isIntersecting);
    },
    { root: scroller, threshold: 0, rootMargin: '80px 0px 80px 0px' }
  );
  _anchorObserver.observe(anchor);
}

// ── Clock ──
const DAYS = ['日','月','火','水','木','金','土'];
function updateClock() {
  const n = new Date();
  let hms;
  if (debugMinutes !== null) {
    const dh = Math.floor(debugMinutes / 60) % 24;
    const dm = debugMinutes % 60;
    hms = `${String(dh).padStart(2,'0')}:${String(dm).padStart(2,'0')}:--`;
  } else {
    hms = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  }
  document.getElementById('clock').textContent = hms;
  const day = debugDay !== null ? debugDay : n.getDay();
  document.getElementById('date-line').textContent =
    `${n.getMonth()+1}月${n.getDate()}日（${DAYS[day]}）${isWeekday()?'平日ダイヤ':'土休日ダイヤ（参考）'}`;
  if (debugMinutes === null && n.getSeconds() === 0) render();
}

// ── Theme ──
function applyTheme(tab) {
  const isIki = tab === 'iki';
  document.documentElement.style.setProperty('--theme', isIki ? '#0a3d7a' : '#0a4a1a');
  document.documentElement.style.setProperty('--theme-line', isIki ? '#4da6ff' : '#7de88a');
}

// ── Tab / board ──
function switchTab(tab) {
  activeTab = tab;
  applyTheme(tab);
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById(`pane-${tab}`).classList.add('active');
  render();
}
function setBoard(b) {
  board = b;
  document.querySelectorAll('.board-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`btn-${b}`).classList.add('active');
  renderIki();
}
function render() {
  if (activeTab === 'iki') renderIki(); else renderKaeri();
}

// ── Delay info ──
async function fetchDelay() {
  try {
    const r = await fetch('https://trafficinfo.westjr.co.jp/chugoku.html');
    const text = await r.text();
    document.getElementById('delay-banner').classList.toggle('show', text.includes('可部線'));
  } catch {
    document.getElementById('delay-banner').classList.remove('show');
  }
}
function openTrafficInfo() {
  window.open('https://trafficinfo.westjr.co.jp/chugoku.html', '_blank');
}

function manualRefresh() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  btn.addEventListener('animationend', () => btn.classList.remove('spinning'), { once: true });
  render();
  fetchDelay();
  scrollToAnchor();
}
